[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg-chronicler"
dynamic = ["version"]
description = "Transkrypcja i podsumowania nagrań sesji RPG z Google Drive"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "faster-whisper>=1.2",
    "pyannote.audio>=4.0",
    "torch",
    "weasyprint>=60",
    "markdown>=3.5",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
gemini = ["google-genai>=2.0"]
dev = ["pytest"]
# nowe okno na Windowsie (Edge WebView2); na Linuksie okno GTK + WebKit z systemu, bez tej paczki
okno = ["pywebview>=5"]

[project.scripts]
rpg-chronicler = "rpg_chronicler.cli:main"

[tool.setuptools.dynamic]
version = {attr = "rpg_chronicler.version.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpg_chronicler = ["prompts/*.md", "gui/*.svg", "nowosci.md", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:anyio"
markers = ["gui: test dymny GUI w Broadway (systemowy Python z GTK 4); wyłączenie: -m \"not gui\""]
