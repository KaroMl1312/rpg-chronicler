[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg-chronicler"
version = "0.1.0"
description = "Transkrypcja i podsumowania nagrań sesji RPG z Google Drive"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2",
    "pyannote.audio>=4.0",
    "torch",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
gemini = ["google-genai>=2.0"]
dev = ["pytest"]

[project.scripts]
rpg-chronicler = "rpg_chronicler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpg_chronicler = ["prompts/*.md"]
