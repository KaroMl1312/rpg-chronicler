# Ustawienia kampanii. Nazwa sekcji = prefiks nazwy pliku nagrania (część przed pierwszym "_"),
# np. "Warhammer_261015.m4a" -> [Warhammer].
#
#   system   - nazwa systemu RPG używana w promptach (styl i słownictwo kroniki)
#   kontekst - opcjonalny opis świata/kampanii dołączany do promptu podsumowania
#
# Nagrania bez pasującej sekcji dostają system z prefiksu nazwy pliku (jak dotąd).

[Warhammer]
system = "Warhammer"

[Fallout]
system = "Fallout"

[Dragonbane]
system = "Dragonbane"

[Zakon]
system = "Zakon"
# kontekst = "Krótki opis kampanii, ważne postacie, miejsca..."
