<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e7c1"/>
      <stop offset="1" stop-color="#e3c98f"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98a4b"/>
      <stop offset="0.5" stop-color="#e8cf98"/>
      <stop offset="1" stop-color="#9c6f36"/>
    </linearGradient>
  </defs>
  <!-- cień -->
  <rect x="22" y="22" width="84" height="98" rx="6" fill="#000" opacity="0.15"/>
  <!-- pergamin -->
  <rect x="22" y="16" width="84" height="98" rx="4" fill="url(#parchment)"/>
  <!-- zwoje u góry i u dołu -->
  <rect x="14" y="10" width="100" height="14" rx="7" fill="url(#roll)"/>
  <rect x="14" y="106" width="100" height="14" rx="7" fill="url(#roll)"/>
  <!-- linie tekstu -->
  <g stroke="#8a6a3a" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <line x1="36" y1="40" x2="92" y2="40"/>
    <line x1="36" y1="53" x2="84" y2="53"/>
    <line x1="36" y1="66" x2="70" y2="66"/>
  </g>
  <!-- fala dźwięku (nagranie) -->
  <g stroke="#3584e4" stroke-width="5" stroke-linecap="round">
    <line x1="38" y1="86" x2="38" y2="90"/>
    <line x1="47" y1="80" x2="47" y2="96"/>
    <line x1="56" y1="84" x2="56" y2="92"/>
    <line x1="65" y1="77" x2="65" y2="99"/>
  </g>
  <!-- pieczęć z kością k20 -->
  <circle cx="88" cy="88" r="15" fill="#c01c28"/>
  <circle cx="88" cy="88" r="15" fill="none" stroke="#8a1520" stroke-width="2"/>
  <polygon points="88,78 96.7,83 96.7,93 88,98 79.3,93 79.3,83" fill="none" stroke="#fbe9ea" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="88,81 94,91 82,91" fill="none" stroke="#fbe9ea" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
