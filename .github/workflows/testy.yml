# Testy przy każdym pushu i pull requeście.
# Bez modeli (torch, faster-whisper, pyannote) - testy ich nie potrzebują (patrz CLAUDE.md, „Zasady przy zmianach”).
# Python 3.11 jak .venv, najnowszy 3.x jak systemowy Python, na którym działa GUI.
name: Testy

on:
  push:
  pull_request:

jobs:
  testy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Biblioteki systemowe (PDF - WeasyPrint, przycinanie ciszy - ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core

      - name: Zależności testów
        run: |
          python -m pip install --upgrade pip
          pip install pytest markdown weasyprint
          pip install --no-deps -e .

      - name: Testy
        run: pytest
